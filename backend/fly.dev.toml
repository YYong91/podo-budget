# Fly.io 배포 설정 - Backend (개발환경)

app = "podo-budget-dev"
primary_region = "nrt"

[build]

# release_command 제거 — main.py lifespan에서 sys.executable로 alembic 실행 (#336)

[env]
  PORT = "8000"
  APP_NAME = "PodoBudget-Dev"
  # DEBUG는 Fly.io secrets로 관리 — 스택 트레이스 공개 노출 방지 (#157)
  # DATABASE_URL은 Fly.io secrets로 관리 (fly secrets set DATABASE_URL=postgresql+asyncpg://...)
  SENTRY_ENVIRONMENT = "development"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true   # 트래픽 없으면 자동 중지
  auto_start_machines = true
  min_machines_running = 1    # 항상 1대 유지 — 콜드스타트 방지, 프리 티어 범위

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"

# 256MB로 충분 — min_machines_running=1로 콜드스타트 없이 프리 티어 유지
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Fly.io 배포 설정 - Backend (개발환경)

app = "podo-budget-dev"
primary_region = "nrt"

[build]

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  PORT = "8000"
  APP_NAME = "PodoBudget-Dev"
  # DEBUG는 Fly.io secrets로 관리 — 스택 트레이스 공개 노출 방지 (#157)
  # DATABASE_URL은 Fly.io secrets로 관리 (fly secrets set DATABASE_URL=postgresql+asyncpg://...)
  SENTRY_ENVIRONMENT = "development"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true   # 비용 절약: 사용 안 할 때 자동 중지
  auto_start_machines = true
  min_machines_running = 0    # 비용 절약: 최소 0대

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

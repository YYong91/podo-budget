name: 종목 목록 갱신

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 평일 09:00 UTC = 18:00 KST (장 마감 후)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-stocks:
    name: KRX 종목 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install httpx psycopg2-binary sqlalchemy

      - name: 종목 갱신 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scripts/update_stocks.py

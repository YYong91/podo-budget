# CD: develop 머지 시 개발환경 배포 (테스트 없이 배포만)
name: CD (Dev)

on:
  push:
    branches: [develop]

# 동시 배포 방지
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ── 배포 시작 알림 ─────────────────────────────────
  notify-deploy-start:
    name: 배포 시작 알림
    uses: ./.github/workflows/notify.yml
    with:
      message: "${{ startsWith(github.ref_name, 'release/') && '[RELEASE]' || '[DEV]' }} 🚀 podo-budget 배포 시작"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  # ── Backend 배포 (Fly.io) ──────────────────────────
  deploy-backend:
    name: BE 배포
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      failure_reason: ${{ steps.on-failure.outputs.reason }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 백엔드 배포
        run: |
          set -o pipefail
          flyctl deploy --local-only --yes --config backend/fly.dev.toml --dockerfile backend/Dockerfile 2>&1 | tee /tmp/deploy.log

      - name: 실패 원인 수집
        id: on-failure
        if: failure()
        run: |
          REASON=$(grep -iE "error|failed" /tmp/deploy.log 2>/dev/null | tail -3 | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ' | cut -c1-300)
          echo "reason=${REASON:-Fly.io 배포 실패}" >> $GITHUB_OUTPUT

  # ── Frontend 배포 (Cloudflare Pages) ───────────────
  deploy-frontend:
    name: FE 배포
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    outputs:
      failure_reason: ${{ steps.on-failure.outputs.reason }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 빌드
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: https://podo-budget-dev.fly.dev/api
          VITE_SUPABASE_URL: https://ycdjgoaqhvnfdagwcwre.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8tQnNwzfhvLyxRnWJe6Flg_27qFcfQ8
          VITE_AUTH_CALLBACK_URL: https://podo-budget-dev.pages.dev/auth/callback
          VITE_BOOKSHELF_URL: ${{ secrets.VITE_BOOKSHELF_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: development

      - name: Cloudflare 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy frontend/dist \
            --project-name=podo-budget-dev \
            --commit-message="Deploy ${{ github.sha }}" \
            --commit-hash="${{ github.sha }}" \
            --branch="develop" \
            2>&1 | tee /tmp/deploy.log

      - name: 실패 원인 수집
        id: on-failure
        if: failure()
        run: |
          REASON=$(grep -iE "error|failed" /tmp/deploy.log 2>/dev/null | tail -3 | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ' | cut -c1-300)
          echo "reason=${REASON:-Cloudflare Pages 배포 실패}" >> $GITHUB_OUTPUT

  # ── 배포 후 스모크 테스트 ──────────────────────────
  smoke-test:
    name: 스모크 테스트
    needs: [deploy-backend, deploy-frontend]
    if: needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.smoke.outputs.result }}

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 헬스체크 (재시도 포함)
        id: smoke
        env:
          BE_URL: https://podo-budget-dev.fly.dev
        run: |
          # 재시도 함수: 최대 N회, 간격 M초
          check_url() {
            local url="$1" label="$2" max_retries=5 interval=15
            for i in $(seq 1 $max_retries); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ $label → $HTTP_CODE (시도 $i/$max_retries)"
                return 0
              fi
              echo "⏳ $label → $HTTP_CODE (시도 $i/$max_retries, ${interval}초 후 재시도)"
              [ "$i" -lt "$max_retries" ] && sleep $interval
            done
            echo "❌ $label → $HTTP_CODE (${max_retries}회 실패)"
            return 1
          }

          echo "20초 대기 (서버 부팅)..."
          sleep 20

          FAILED=0
          check_url "$BE_URL/health" "BE /health" || FAILED=1
          check_url "$BE_URL/" "BE /" || FAILED=1

          if [ "$FAILED" = "1" ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::error::스모크 테스트 실패"
            exit 1
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
          fi

  # ── 프로젝트 상태 업데이트 (On Dev) ────────────────
  update-project-status:
    name: 프로젝트 상태
    needs: [deploy-backend, deploy-frontend]
    if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
    uses: ./.github/workflows/project-status.yml
    with:
      target_status: on_dev
    secrets:
      PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

  # ── 배포 결과 알림 ─────────────────────────────────
  notify-deploy-result:
    name: 배포 결과 알림
    needs: [deploy-backend, deploy-frontend, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20  # 최근 커밋 목록용

      - name: 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_STATUS: ${{ needs.deploy-backend.result }}
          FRONTEND_STATUS: ${{ needs.deploy-frontend.result }}
          SMOKE_STATUS: ${{ needs.smoke-test.result }}
          BACKEND_FAILURE: ${{ needs.deploy-backend.outputs.failure_reason }}
          FRONTEND_FAILURE: ${{ needs.deploy-frontend.outputs.failure_reason }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual trigger' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENV_PREFIX: ${{ startsWith(github.ref_name, 'release/') && '[RELEASE]' || '[DEV]' }}
        run: |
          DISPLAY_MSG="$(echo "$COMMIT_MSG" | head -1)"

          PR_NUM="$(echo "$DISPLAY_MSG" | grep -oE '#[0-9]+' | tail -1 | tr -d '#')"
          if [ -n "$PR_NUM" ]; then
            PR_LINK="https://github.com/${REPO}/pull/${PR_NUM}"
          fi

          # 최근 커밋 3개 요약
          COMMITS=$(git log --oneline -3 --format="• %s" 2>/dev/null | head -3)

          if [ "$BACKEND_STATUS" = "success" ] && [ "$FRONTEND_STATUS" = "success" ]; then
            KST_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"

            # 스모크 테스트 결과
            SMOKE_ICON="🟢"
            [ "$SMOKE_STATUS" = "failure" ] && SMOKE_ICON="🔴"
            [ "$SMOKE_STATUS" = "skipped" ] && SMOKE_ICON="⏭️"

            MESSAGE="$(printf '%s ✅ 배포 완료\n📝 %s\n🏥 스모크: %s\n🕐 %s\n\n📋 최근 변경:\n%s' \
              "${ENV_PREFIX}" \
              "${DISPLAY_MSG}" \
              "${SMOKE_ICON}" \
              "${KST_TIME}" \
              "${COMMITS}")"
            [ -n "$PR_LINK" ] && MESSAGE="${MESSAGE}"$'\n'"🔗 ${PR_LINK}"
          elif [ "$SMOKE_STATUS" = "failure" ]; then
            MESSAGE="${ENV_PREFIX} 🔥 스모크 테스트 실패 — 배포는 완료됐으나 헬스체크 실패"
            MESSAGE="${MESSAGE}"$'\n'"🔗 https://github.com/${REPO}/actions/runs/${RUN_ID}"
          else
            MESSAGE="${ENV_PREFIX} ❌ 배포 실패 (BE: ${BACKEND_STATUS}, FE: ${FRONTEND_STATUS})"
            [ -n "$BACKEND_FAILURE" ] && MESSAGE="${MESSAGE}"$'\n'"🔴 BE: ${BACKEND_FAILURE}"
            [ -n "$FRONTEND_FAILURE" ] && MESSAGE="${MESSAGE}"$'\n'"🔴 FE: ${FRONTEND_FAILURE}"
            MESSAGE="${MESSAGE}"$'\n'"🔗 https://github.com/${REPO}/actions/runs/${RUN_ID}"
          fi

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" || true

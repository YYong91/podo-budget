# E2E 테스트 (수동 실행 전용)
# SSO 전환 후 auth spec 미업데이트로 현재 비활성화 상태
# TODO: SSO 테스트 환경 구성 후 PR 트리거 복원
name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --all-extras

      - name: Start backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e_test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
          DEBUG: "true"
        run: |
          PYTHONPATH=backend uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -f http://localhost:8000/health || exit 1

      - name: Build and serve frontend
        run: |
          cd frontend && npm ci && npm run build
          npx serve dist -l 5173 -s &
          sleep 2
        env:
          VITE_API_URL: http://localhost:8000/api

      - name: Install Playwright
        run: cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
          CI: "true"
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

# 백엔드/프론트엔드 테스트 재사용 워크플로우
name: 테스트

on:
  workflow_call:
    inputs:
      frontend_build_check:
        description: "프론트엔드 빌드 검증 포함 여부"
        required: false
        default: true
        type: boolean
    outputs:
      backend_result:
        description: "백엔드 테스트 결과"
        value: ${{ jobs.test-backend.result }}
      frontend_result:
        description: "프론트엔드 테스트 결과"
        value: ${{ jobs.test-frontend.result }}

jobs:
  test-backend:
    name: 백엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.20"  # 버전 고정 — 공급망 보안 (#139)
          enable-cache: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: uv sync --all-extras

      - name: 린트
        run: uv run ruff check backend/

      - name: 포맷 검증
        run: uv run ruff format --check backend/  # 포맷 미준수 코드 CI 차단 (#177)

      - name: 의존성 취약점 스캔
        # CVE-2024-23342(ecdsa): python-jose의 transitive dep, 최신 버전(0.19.1)에도 수정 없음 — ignore (#237)
        run: uv run pip-audit --ignore-vuln CVE-2024-23342

      - name: 타입 체크 (pyright)
        run: |
          uv run pyright backend/app/ --pythonpath backend 2>&1 | tail -5
        continue-on-error: true  # 처음엔 경고만 — 기준선 확보 후 필수로 전환

      - name: 시크릿 스캔
        run: |
          if [ ! -f .secrets.baseline ]; then
            uv run detect-secrets scan --exclude-files 'uv\.lock|package-lock\.json' > .secrets.baseline
          fi
          uv run detect-secrets scan --exclude-files 'uv\.lock|package-lock\.json' --baseline .secrets.baseline

      - name: 테스트 + 커버리지
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
        run: |
          PYTHONPATH=backend uv run pytest backend/tests/ \
            --ignore=backend/tests/integration/test_api_budget_bulk.py \
            --cov=app --cov-report=term --cov-report=json:backend-coverage.json

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage.json
          retention-days: 5

      - name: 마이그레이션 정합성 검증
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
        run: |
          cd backend
          # Alembic head가 현재 DB 상태와 일치하는지 확인
          PYTHONPATH=. uv run alembic upgrade head
          # 모델과 마이그레이션이 동기화되어 있는지 확인 (autogenerate diff가 비어있어야 함)
          PYTHONPATH=. uv run alembic check 2>&1 || echo "::warning::pending 마이그레이션이 감지되었습니다. alembic revision --autogenerate로 마이그레이션을 생성하세요."
        continue-on-error: true  # 처음엔 경고만 — 안정화 후 필수로 전환 (#255)

      - name: API 스키마 스냅샷 생성
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
        run: |
          PYTHONPATH=backend uv run python -c "
          import json
          from app.main import app
          schema = app.openapi()
          # 엔드포인트 목록 + 요약만 추출 (전체 스키마는 너무 큼)
          summary = {
            'info': schema.get('info', {}),
            'endpoint_count': sum(len(methods) for methods in schema.get('paths', {}).values()),
            'endpoints': {
              path: list(methods.keys())
              for path, methods in sorted(schema.get('paths', {}).items())
            },
            'schema_count': len(schema.get('components', {}).get('schemas', {})),
            'schemas': sorted(schema.get('components', {}).get('schemas', {}).keys()),
          }
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          " > /tmp/api-schema-summary.json

      - name: API 스키마 업로드
        uses: actions/upload-artifact@v4
        with:
          name: api-schema
          path: /tmp/api-schema-summary.json
          retention-days: 5

  test-frontend:
    name: 프론트엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: cd frontend && npm ci

      - name: 린트
        run: cd frontend && npm run lint

      - name: 의존성 취약점 스캔
        run: cd frontend && npm audit --audit-level=high --omit=dev  # 런타임 의존성만 심각(high+) CVE 탐지 (#237)

      - name: 테스트 + 커버리지
        run: cd frontend && npm run test:coverage

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 5

      - name: 빌드 검증
        if: inputs.frontend_build_check
        run: cd frontend && npm run build
        env:
          VITE_API_URL: /api

      - name: 번들 크기 분석
        if: inputs.frontend_build_check
        continue-on-error: true
        run: cd frontend && node scripts/bundle-size.mjs

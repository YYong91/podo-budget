# 백엔드/프론트엔드 테스트 재사용 워크플로우
name: 테스트

on:
  workflow_call:
    inputs:
      frontend_build_check:
        description: "프론트엔드 빌드 검증 포함 여부"
        required: false
        default: true
        type: boolean
    outputs:
      backend_result:
        description: "백엔드 테스트 결과"
        value: ${{ jobs.test-backend.result }}
      frontend_result:
        description: "프론트엔드 테스트 결과"
        value: ${{ jobs.test-frontend.result }}

jobs:
  test-backend:
    name: 백엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.20"  # 버전 고정 — 공급망 보안 (#139)
          enable-cache: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: uv sync --all-extras

      - name: 린트
        run: uv run ruff check backend/

      - name: 포맷 검증
        run: uv run ruff format --check backend/  # 포맷 미준수 코드 CI 차단 (#177)

      - name: 테스트 실행
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
        run: PYTHONPATH=backend uv run pytest backend/tests/ --ignore=backend/tests/integration/test_api_budget_bulk.py

  test-frontend:
    name: 프론트엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: cd frontend && npm ci

      - name: 린트
        run: cd frontend && npm run lint

      - name: 테스트 실행
        run: cd frontend && npm run test:run

      - name: 빌드 검증
        if: inputs.frontend_build_check
        run: cd frontend && npm run build
        env:
          VITE_API_URL: /api

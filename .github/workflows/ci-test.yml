# 백엔드/프론트엔드 테스트 재사용 워크플로우
name: 테스트

on:
  workflow_call:
    inputs:
      frontend_build_check:
        description: "프론트엔드 빌드 검증 포함 여부"
        required: false
        default: true
        type: boolean
    outputs:
      backend_result:
        description: "백엔드 테스트 결과"
        value: ${{ jobs.test-backend.result }}
      frontend_result:
        description: "프론트엔드 테스트 결과"
        value: ${{ jobs.test-frontend.result }}

jobs:
  test-backend:
    name: 백엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.20"  # 버전 고정 — 공급망 보안 (#139)
          enable-cache: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: uv sync --all-extras

      - name: 린트
        run: uv run ruff check backend/

      - name: 포맷 검증
        run: uv run ruff format --check backend/  # 포맷 미준수 코드 CI 차단 (#177)

      - name: 의존성 취약점 스캔
        # CVE-2024-23342(ecdsa): python-jose의 transitive dep, 최신 버전(0.19.1)에도 수정 없음 — ignore (#237)
        run: uv run pip-audit --ignore-vuln CVE-2024-23342

      - name: 테스트 + 커버리지
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key  # pragma: allowlist secret
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key  # pragma: allowlist secret
        run: |
          PYTHONPATH=backend uv run pytest backend/tests/ \
            --ignore=backend/tests/integration/test_api_budget_bulk.py \
            --cov=app --cov-report=term --cov-report=json:backend-coverage.json

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage.json
          retention-days: 5

  test-frontend:
    name: 프론트엔드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: cd frontend && npm ci

      - name: 린트
        run: cd frontend && npm run lint

      - name: 의존성 취약점 스캔
        run: cd frontend && npm audit --audit-level=high --omit=dev  # 런타임 의존성만 심각(high+) CVE 탐지 (#237)

      - name: 테스트 + 커버리지
        run: cd frontend && npm run test:coverage

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 5

      - name: 빌드 검증
        if: inputs.frontend_build_check
        run: cd frontend && npm run build
        env:
          VITE_API_URL: /api

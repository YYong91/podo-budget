name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

# 동일 PR에서 새 커밋 push 시 이전 실행 취소
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── 테스트 시작 알림 ─────────────────────────────
  notify-test-start:
    name: 테스트 시작 알림
    uses: ./.github/workflows/notify.yml
    with:
      message: "${{ (github.base_ref == 'main' && '[PROD]') || (startsWith(github.base_ref, 'release/') && '[RELEASE]') || '[DEV]' }} 🧪 podo-budget 테스트 시작\n📝 #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title || 'Manual trigger' }}"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  test:
    name: 테스트
    uses: ./.github/workflows/ci-test.yml
    with:
      frontend_build_check: true

  # ── 커버리지 PR 코멘트 ─────────────────────────────
  coverage-comment:
    name: 커버리지 리포트
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write

    steps:
      - name: BE 커버리지 다운로드
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: ./coverage
        continue-on-error: true

      - name: FE 커버리지 다운로드
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: ./coverage
        continue-on-error: true

      - name: 번들 크기 다운로드
        uses: actions/download-artifact@v4
        with:
          name: bundle-sizes
          path: ./bundle
        continue-on-error: true

      - name: API 스키마 다운로드
        uses: actions/download-artifact@v4
        with:
          name: api-schema
          path: ./schema
        continue-on-error: true

      - name: CI 리포트 코멘트 작성
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 CI 리포트\n\n';

            // BE 커버리지 파싱
            try {
              const be = JSON.parse(fs.readFileSync('./coverage/backend-coverage.json', 'utf8'));
              const total = be.totals;
              comment += `### Backend (pytest-cov)\n`;
              comment += `| 항목 | 커버리지 |\n|------|----------|\n`;
              comment += `| **Statements** | ${total.percent_covered_display}% |\n`;
              comment += `| Lines | ${total.covered_lines} / ${total.num_statements} |\n\n`;
            } catch (e) {
              comment += '### Backend\n⚠️ 커버리지 데이터 없음\n\n';
            }

            // FE 커버리지 파싱
            try {
              const fe = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = fe.total;
              comment += `### Frontend (vitest)\n`;
              comment += `| 항목 | 커버리지 |\n|------|----------|\n`;
              comment += `| **Statements** | ${total.statements.pct}% |\n`;
              comment += `| **Branches** | ${total.branches.pct}% |\n`;
              comment += `| **Functions** | ${total.functions.pct}% |\n`;
              comment += `| **Lines** | ${total.lines.pct}% |\n\n`;
            } catch (e) {
              comment += '### Frontend\n⚠️ 커버리지 데이터 없음\n\n';
            }

            // 번들 크기
            try {
              const bundle = JSON.parse(fs.readFileSync('./bundle/bundle-sizes.json', 'utf8'));
              const totalKB = (bundle.total_gzip / 1024).toFixed(1);
              comment += `### 📦 번들 크기 (gzipped)\n`;
              comment += `| 파일 | 크기 |\n|------|------|\n`;
              for (const f of bundle.files) {
                comment += `| ${f.name} | ${(f.gzip / 1024).toFixed(1)}KB |\n`;
              }
              comment += `| **합계** | **${totalKB}KB** |\n\n`;
            } catch (e) {
              // 번들 데이터 없으면 생략
            }

            // API 스키마
            try {
              const schema = JSON.parse(fs.readFileSync('./schema/api-schema-summary.json', 'utf8'));
              comment += `### 🔌 API 스키마\n`;
              comment += `엔드포인트 ${schema.endpoint_count}개, 스키마 ${schema.schema_count}개\n\n`;
            } catch (e) {
              // 스키마 데이터 없으면 생략
            }

            // 기존 코멘트 찾아서 업데이트 (중복 방지)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('📊 CI 리포트') || c.body.includes('📊 테스트 커버리지 리포트'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  # ── 테스트 결과 메시지 빌드 ──────────────────────
  build-test-result-message:
    name: 결과 메시지 빌드
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      message: ${{ steps.build.outputs.message }}
    steps:
      - name: 메시지 빌드
        id: build
        env:
          TEST_STATUS: ${{ needs.test.result }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual trigger' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENV_PREFIX: ${{ (github.base_ref == 'main' && '[PROD]') || (startsWith(github.base_ref, 'release/') && '[RELEASE]') || '[DEV]' }}
        run: |
          PR_LINK="https://github.com/${REPO}/pull/${PR_NUMBER}"

          if [ "$TEST_STATUS" = "success" ]; then
            MESSAGE="$(printf '%s ✅ podo-budget 테스트 통과\n📝 #%s %s\n🔗 %s' \
              "${ENV_PREFIX}" "${PR_NUMBER}" "${PR_TITLE}" "${PR_LINK}")"
          else
            MESSAGE="$(printf '%s ❌ podo-budget 테스트 실패\n📝 #%s %s\n🔗 https://github.com/%s/actions/runs/%s' \
              "${ENV_PREFIX}" "${PR_NUMBER}" "${PR_TITLE}" "${REPO}" "${RUN_ID}")"
          fi

          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "${MESSAGE}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ── 테스트 결과 알림 ─────────────────────────────
  notify-test-result:
    name: 테스트 결과 알림
    needs: [build-test-result-message]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      message: ${{ needs.build-test-result-message.outputs.message }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# 동일 PR에서 새 커밋 push 시 이전 실행 취소
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── 테스트 시작 알림 ─────────────────────────────
  notify-test-start:
    name: 테스트 시작 알림
    uses: ./.github/workflows/notify.yml
    with:
      message: "${{ github.base_ref == 'main' && '[PROD]' || '[DEV]' }} 🧪 podo-budget 테스트 시작\n📝 #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title || 'Manual trigger' }}"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  test:
    name: 테스트
    uses: ./.github/workflows/ci-test.yml
    with:
      frontend_build_check: true

  # ── 테스트 결과 알림 ─────────────────────────────
  notify-test-result:
    name: 테스트 결과 알림
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_STATUS: ${{ needs.test.result }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual trigger' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENV_PREFIX: ${{ github.base_ref == 'main' && '[PROD]' || '[DEV]' }}
        run: |
          if [ "$TEST_STATUS" = "success" ]; then
            MESSAGE="$(printf '%s ✅ podo-budget 테스트 통과\n📝 #%s %s' \
              "${ENV_PREFIX}" \
              "${PR_NUMBER}" \
              "${PR_TITLE}")"
          else
            MESSAGE="$(printf '%s ❌ podo-budget 테스트 실패\n📝 #%s %s\n🔗 https://github.com/%s/actions/runs/%s' \
              "${ENV_PREFIX}" \
              "${PR_NUMBER}" \
              "${PR_TITLE}" \
              "${REPO}" \
              "${RUN_ID}")"
          fi

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" || true

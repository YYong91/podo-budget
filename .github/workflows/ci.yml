name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

# 동일 PR에서 새 커밋 push 시 이전 실행 취소
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── 테스트 시작 알림 ─────────────────────────────
  notify-test-start:
    name: 테스트 시작 알림
    uses: ./.github/workflows/notify.yml
    with:
      message: "${{ (github.base_ref == 'main' && '[PROD]') || (startsWith(github.base_ref, 'release/') && '[RELEASE]') || '[DEV]' }} 🧪 podo-budget 테스트 시작\n📝 #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title || 'Manual trigger' }}"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  test:
    name: 테스트
    uses: ./.github/workflows/ci-test.yml
    with:
      frontend_build_check: true

  # ── 테스트 결과 메시지 빌드 ──────────────────────
  build-test-result-message:
    name: 결과 메시지 빌드
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      message: ${{ steps.build.outputs.message }}
    steps:
      - name: 메시지 빌드
        id: build
        env:
          TEST_STATUS: ${{ needs.test.result }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual trigger' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENV_PREFIX: ${{ (github.base_ref == 'main' && '[PROD]') || (startsWith(github.base_ref, 'release/') && '[RELEASE]') || '[DEV]' }}
        run: |
          PR_LINK="https://github.com/${REPO}/pull/${PR_NUMBER}"

          if [ "$TEST_STATUS" = "success" ]; then
            MESSAGE="$(printf '%s ✅ podo-budget 테스트 통과\n📝 #%s %s\n🔗 %s' \
              "${ENV_PREFIX}" "${PR_NUMBER}" "${PR_TITLE}" "${PR_LINK}")"
          else
            MESSAGE="$(printf '%s ❌ podo-budget 테스트 실패\n📝 #%s %s\n🔗 https://github.com/%s/actions/runs/%s' \
              "${ENV_PREFIX}" "${PR_NUMBER}" "${PR_TITLE}" "${REPO}" "${RUN_ID}")"
          fi

          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "${MESSAGE}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ── 테스트 결과 알림 ─────────────────────────────
  notify-test-result:
    name: 테스트 결과 알림
    needs: [build-test-result-message]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      message: ${{ needs.build-test-result-message.outputs.message }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

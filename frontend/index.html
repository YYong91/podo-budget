<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="포도알처럼 하나씩, 알찬 가계부" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="referrer" content="same-origin" />
    <title>포도가계부 - AI 가계부</title>
    <!-- FOUC 방지: React 마운트 전에 다크모드 클래스 즉시 적용 -->
    <script>
      ;(function(){
        var t = localStorage.getItem('theme')
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').content = '#1a1625'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

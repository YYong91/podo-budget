<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-book-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="말로 기록하면 AI가 알아서 분류하는 우리 집 가계부. 메신저 한 줄이면 끝." />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="referrer" content="same-origin" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="canonical" href="https://budget.podonest.com" />
    <title>포도가계부 — 드디어 꾸준히 쓰게 되는 가계부</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="포도가계부 — 드디어 꾸준히 쓰게 되는 가계부" />
    <meta property="og:description" content="말로 기록하면 AI가 알아서 분류하는 우리 집 가계부. 메신저 한 줄이면 끝." />
    <meta property="og:image" content="https://budget.podonest.com/og-image.png?v=3" />
    <meta property="og:url" content="https://budget.podonest.com" />
    <meta property="og:site_name" content="포도가계부" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="포도가계부 — 드디어 꾸준히 쓰게 되는 가계부" />
    <meta name="twitter:description" content="말로 기록하면 AI가 알아서 분류하는 우리 집 가계부." />
    <meta name="twitter:image" content="https://budget.podonest.com/og-image.png?v=3" />
    <!-- FOUC 방지: React 마운트 전에 다크모드 클래스 즉시 적용 -->
    <script>
      ;(function(){
        var t = localStorage.getItem('theme')
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#1a1625'
          document.querySelector('meta[name="theme-color"]').content = '#1a1625'
        } else {
          document.documentElement.style.backgroundColor = '#fefce8'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 포도가계부 PWA 아이콘 (크림 배경 + 포도책) -->
  <rect width="512" height="512" fill="#fefce8"/>
  <g transform="translate(256, 240)">
    <!-- 책 몸체 -->
    <rect x="-100" y="-110" width="200" height="220" rx="16" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="4"/>
    <!-- 책 옆면 (페이지) -->
    <rect x="96" y="-100" width="16" height="200" rx="4" fill="#ddd6fe" stroke="#c4b5fd" stroke-width="2"/>
    <!-- 책 표지 라인 -->
    <line x1="-80" y1="80" x2="80" y2="80" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <!-- 포도 (책 표지 위) -->
    <g transform="translate(0, -20)">
      <!-- 잎 -->
      <path d="M 2,-52 Q 18,-66 22,-50 Q 12,-44 2,-52 Z" fill="#22c55e"/>
      <!-- 포도알 3개 -->
      <circle cx="-18" cy="-24" r="22" fill="#9333ea"/>
      <circle cx="18" cy="-24" r="22" fill="#a855f7"/>
      <circle cx="0" cy="4" r="22" fill="#9333ea"/>
    </g>
  </g>
</svg>

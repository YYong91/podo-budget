<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 포도책 파비콘 — 투명 배경, 캔버스 꽉 채움 -->
  <g transform="translate(29, 33)">
    <!-- 책 몸체 -->
    <rect x="-22" y="-24" width="44" height="48" rx="4" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <!-- 책 옆면 (페이지) -->
    <rect x="21" y="-22" width="4" height="44" rx="1" fill="#ddd6fe" stroke="#c4b5fd" stroke-width="0.8"/>
    <!-- 책 표지 라인 -->
    <line x1="-17" y1="17" x2="17" y2="17" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round"/>
    <!-- 포도 (책 표지 위) -->
    <g transform="translate(0, -5)">
      <!-- 잎 -->
      <path d="M 0.5,-12 Q 4,-15 5,-11 Q 3,-10 0.5,-12 Z" fill="#22c55e"/>
      <!-- 포도알 3개 -->
      <circle cx="-4" cy="-5.5" r="5" fill="#9333ea"/>
      <circle cx="4" cy="-5.5" r="5" fill="#a855f7"/>
      <circle cx="0" cy="1" r="5" fill="#9333ea"/>
    </g>
  </g>
</svg>
